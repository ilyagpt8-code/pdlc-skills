# Описание ансамбля по прогону 006 (спецификация утилиты tempconv).
run = "006"
title = "спецификация утилиты tempconv"
deliverable = "спецификацию"          # что принимает эксперт, если нет продюсера
result_path = "out/{run}-{X}/tempconv.md"
budget_usd = 1
max_rounds = 12
owner_questions = false
# compass = "specs/compass.md"        # необязательно
# accept_role = "producer"            # по умолчанию: producer, если он есть, иначе expert
# tests_path = "out/{run}-{X}/tests"  # необязательно: после стопа расписание гонит pytest

task = """
Нужна спецификация консольной утилиты `tempconv` — конвертера температур между шкалами Цельсия (C), Фаренгейта (F) и Кельвина (K). Спецификация должна быть такой, чтобы по ней **другая команда** без вопросов написала программу и тесты.

Результат: файл `{out}` (путь от корня репозитория).

Что важно пользователю утилиты:
- перевод значения из одной шкалы в другую одной командой;
- понятная реакция на неверный ввод (не число, неизвестная шкала, температура ниже абсолютного нуля);
- предсказуемый формат вывода и коды выхода, чтобы утилиту можно было вызывать из скриптов.

Остальное (точный синтаксис, округление, крайние случаи) решает команда.
"""

[roles.expert]
ru = "эксперт"
description = "решает, что входит в утилиту и как она себя ведёт; отвечает на вопросы исполнителя; принимает спецификацию. Не пишет файл результата сам."

[roles.executor]
ru = "исполнитель"
description = "пишет файл результата по решениям эксперта; задаёт вопросы эксперту. Не меняет решения эксперта сам."

[roles.tester]
ru = "тестировщик"
skill = ".claude/skills/tester/SKILL.md"
description = "считает, на сколько случаев результат не отвечает заданию."

[roles.producer]
ru = "продюсер"
ru_gen = "продюсера"
ru_dat = "продюсеру"
system = true
skill = ".claude/skills/producer/SKILL.md"

[roles.choreographer]
ru = "хореограф"
ru_gen = "хореографа"
ru_dat = "хореографу"
system = true
skill = ".claude/skills/choreographer/SKILL.md"

[[ensembles]]
name = "A"
roles = ["expert", "executor", "producer", "choreographer"]
repeats = 3

[[ensembles]]
name = "B"
roles = ["expert", "executor"]
repeats = 3
